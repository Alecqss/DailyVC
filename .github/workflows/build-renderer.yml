name: build-renderer

# Build et push de l'image Docker du renderer vers GitHub Container Registry (GHCR).
# Pas besoin de Docker en local : tout se passe dans le cloud à chaque merge sur master
# qui touche renderer/. Déclenchable aussi à la main (workflow_dispatch).

on:
  push:
    branches: [master]
    paths: ['renderer/**', '.github/workflows/build-renderer.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./renderer
          push: true
          tags: |
            ghcr.io/alecqss/highlightgg-renderer:latest
            ghcr.io/alecqss/highlightgg-renderer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
